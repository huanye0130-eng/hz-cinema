<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>杭州影院配置查询工具</title>
  <style>
:root {
  color-scheme: light;
  --bg: #f5f6f8;
  --panel: #ffffff;
  --ink: #202124;
  --muted: #667085;
  --line: #d8dee8;
  --accent: #146b5f;
  --accent-soft: #e5f3ef;
  --gold: #a76d1b;
  --blue: #2f5fa7;
  --red: #b64235;
  --cyan: #0f7b8d;
  --panel-soft: #f8fafc;
  --shadow: 0 10px 28px rgba(16, 24, 40, 0.08);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  flex: 0 0 auto;
  display: grid;
  gap: 14px;
  padding: 18px 24px 14px;
  border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--panel) 94%, transparent);
  backdrop-filter: blur(14px);
}

.topbar-main {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 24px;
}

h1,
h2,
p {
  margin: 0;
}

h1 {
  font-size: 28px;
  line-height: 1.15;
}

h2 {
  font-size: 15px;
}

.topbar p,
.detail p,
.source,
.meta {
  color: var(--muted);
}

.search input {
  width: min(360px, 36vw);
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0 12px;
  font-size: 15px;
  background: var(--panel);
  color: var(--ink);
}

.overview-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.overview-stats,
.quick-filters {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.overview-stats span {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  min-height: 32px;
  padding: 5px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--panel-soft);
  color: var(--muted);
  white-space: nowrap;
}

.overview-stats strong {
  color: var(--ink);
  font-size: 17px;
}

.quick-filters {
  overflow-x: auto;
  scrollbar-width: none;
}

.quick-filters::-webkit-scrollbar {
  display: none;
}

.quick-filter {
  white-space: nowrap;
  font-weight: 650;
}

.layout {
  display: grid;
  flex: 1 1 auto;
  grid-template-columns: 272px minmax(340px, 1fr) minmax(360px, 0.9fr);
  gap: 18px;
  padding: 18px;
  min-height: 0;
  overflow: hidden;
}

.filters,
.results,
.detail {
  min-width: 0;
  min-height: 0;
  height: 100%;
}

.filters,
.results,
.detail {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.filters {
  display: flex;
  flex-direction: column;
  overflow: auto;
}

.filters section {
  padding: 14px;
  border-bottom: 1px solid var(--line);
}

.filters section:last-child {
  border-bottom: 0;
}

.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.chip,
button {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 6px;
  min-height: 32px;
  padding: 6px 10px;
  cursor: pointer;
  color: var(--ink);
  transition: border-color 160ms ease, background 160ms ease, color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
}

button:hover {
  border-color: color-mix(in srgb, var(--accent) 48%, var(--line));
}

button:focus-visible,
input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.chip.active,
.quick-filter.active {
  color: #fff;
  background: var(--accent);
  border-color: var(--accent);
}

.summary {
  display: grid;
  gap: 10px;
  margin-top: 12px;
}

.summary-row {
  border-left: 3px solid var(--accent);
  padding-left: 10px;
}

.summary-row strong {
  display: block;
}

.summary-row span {
  color: var(--muted);
  font-size: 13px;
}

.results {
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.list-header {
  position: sticky;
  top: 0;
  z-index: 5;
  flex: 0 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}

.cinemas {
  display: grid;
  align-content: start;
  gap: 10px;
  padding: 12px;
  flex: 1 1 auto;
  min-height: 0;
  overflow: auto;
}

.cinema {
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  background: var(--panel);
  cursor: pointer;
  box-shadow: none;
}

.cinema:hover {
  border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
  box-shadow: var(--shadow);
  transform: translateY(-1px);
}

.cinema.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft) inset;
  background: color-mix(in srgb, var(--accent-soft) 38%, var(--panel));
}

.cinema h3 {
  margin: 0 0 8px;
  font-size: 16px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.badge {
  border-radius: 5px;
  padding: 3px 7px;
  font-size: 12px;
  line-height: 1.35;
  background: #eef1f4;
  color: #344054;
  font-weight: 650;
}

.badge.seed {
  background: #fff1d6;
  color: var(--gold);
}

.badge.imax {
  background: #e7eefb;
  color: var(--blue);
}

.badge.dolby {
  background: #fde8e5;
  color: var(--red);
}

.badge.laser,
.quick-filter.laser:not(.active) {
  background: #fff5da;
  color: var(--gold);
}

.badge.cinity,
.quick-filter.cinity:not(.active) {
  background: #ddf7fb;
  color: var(--cyan);
}

.quick-filter.imax:not(.active) {
  background: #e7eefb;
  color: var(--blue);
}

.quick-filter.dolby:not(.active) {
  background: #fde8e5;
  color: var(--red);
}

.detail {
  display: flex;
  flex-direction: column;
  padding: 16px;
  overflow: auto;
}

.empty {
  color: var(--muted);
  padding: 20px;
  text-align: center;
}

.detail-head {
  position: sticky;
  top: -16px;
  z-index: 4;
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}

.detail-head h2 {
  font-size: 20px;
  margin-bottom: 8px;
}

#detailSource {
  white-space: nowrap;
  color: var(--muted);
  font-size: 13px;
  opacity: 0.72;
}

.halls {
  display: grid;
  gap: 10px;
  margin-top: 14px;
}

.hall {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  background: var(--panel);
}

.hall-title {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 8px;
}

.hall-title strong {
  overflow-wrap: anywhere;
}

.spec-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  color: var(--ink);
  font-size: 14px;
}

.spec-grid div {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
  background: var(--panel-soft);
}

.spec-grid span {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 12px;
}

.spec-grid strong {
  display: block;
  font-weight: 650;
  overflow-wrap: anywhere;
}

.hall > .meta {
  margin-top: 10px;
  font-size: 12px;
  line-height: 1.45;
  opacity: 0.72;
}

.list-empty {
  align-self: stretch;
  display: grid;
  place-items: center;
  min-height: 180px;
  border: 1px dashed var(--line);
  border-radius: 8px;
  color: var(--muted);
  background: var(--panel-soft);
}

@media (max-width: 1040px) {
  body {
    overflow: auto;
    height: auto;
    min-height: 100dvh;
  }

  .layout {
    grid-template-columns: 220px 1fr;
    overflow: visible;
  }

  .detail {
    grid-column: 1 / -1;
    max-height: 55dvh;
  }
}

@media (max-width: 720px) {
  .topbar {
    padding: 16px;
  }

  .topbar-main,
  .overview-bar {
    display: grid;
    gap: 12px;
  }

  .overview-stats {
    overflow-x: auto;
    scrollbar-width: none;
  }

  .overview-stats::-webkit-scrollbar {
    display: none;
  }

  .search input {
    width: 100%;
  }

  .layout {
    grid-template-columns: 1fr;
    padding: 12px;
    gap: 12px;
  }

  .filters {
    overflow: visible;
    padding-right: 0;
  }

  .filters section {
    padding: 12px;
  }

  .chips {
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }

  .chips::-webkit-scrollbar {
    display: none;
  }

  .chip {
    white-space: nowrap;
  }

  .cinemas {
    max-height: 48dvh;
  }

  .detail {
    max-height: none;
  }

  .detail-head {
    position: static;
    display: grid;
  }

  #detailSource {
    white-space: normal;
  }

  .spec-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 430px) {
  h1 {
    font-size: 23px;
  }

  .spec-grid {
    grid-template-columns: 1fr;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #111418;
    --panel: #191d23;
    --ink: #eef2f7;
    --muted: #a1a9b5;
    --line: #303741;
    --accent: #32b6a2;
    --accent-soft: #173f39;
    --gold: #f2b84d;
    --blue: #8fb8ff;
    --red: #ff8f84;
    --cyan: #5ed6e6;
    --panel-soft: #20262e;
    --shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
  }

  .badge {
    background: #27303a;
    color: #d5dbe5;
  }

  .badge.seed {
    background: #3b2c14;
  }

  .badge.imax,
  .quick-filter.imax:not(.active) {
    background: #182844;
  }

  .badge.dolby,
  .quick-filter.dolby:not(.active) {
    background: #3a1f21;
  }

  .badge.laser,
  .quick-filter.laser:not(.active) {
    background: #3a2b12;
  }

  .badge.cinity,
  .quick-filter.cinity:not(.active) {
    background: #12343b;
  }
}

</style>
</head>

    </section>
  </main>

async function getJson(url) {
  const clean = url.split("?")[0];
  if (clean === "/api/districts") return __DATA.districts;
  if (clean === "/api/special-types") return __DATA.specialTypes;
  if (clean === "/api/summary") return __DATA.summary;
  if (clean === "/api/cinemas") {
    const params = new URLSearchParams(url.split("?")[1] || "");
    const district = params.get("district") || "";
    const special = params.get("special") || "";
    const q = (params.get("q") || "").trim();
    let rows = __DATA.cinemas;
    if (district) rows = rows.filter((r) => r.district === district);
    if (special) rows = rows.filter((r) => (r.special_types || "").split(",").includes(special));
    if (q) rows = rows.filter((r) => r.name.includes(q) || r.address.includes(q));
    return rows.slice().sort((a, b) =>
      a.district.localeCompare(b.district) || b.seed_halls - a.seed_halls || a.name.localeCompare(b.name)
    );
  }
  const m = clean.match(/^\/api\/cinemas\/(\d+)$/);
  if (m) return __DATA.details[Number(m[1])] || { error: "not found" };
  throw new Error("HTTP 404");
}

const state = {
  district: "",
  special: "",
  search: "",
  selectedId: null,
  filtersLoaded: false,
  cinemaRequestId: 0,
  detailRequestId: 0,
};

const SPECIAL_GROUPS = {
  IMAX: ["IMAX", "IMAX激光"],
  杜比: ["杜比影院", "杜比巨幕", "杜比全景声"],
  CINITY: ["CINITY"],
  激光巨幕: ["激光巨幕", "中国巨幕", "杜比巨幕"],
};

const els = {
  meta: document.querySelector("#meta"),
  totalCinemas: document.querySelector("#totalCinemas"),
  totalHalls: document.querySelector("#totalHalls"),
  totalDistricts: document.querySelector("#totalDistricts"),
  quickFilters: document.querySelector("#quickFilters"),
  districts: document.querySelector("#districts"),
  specialTypes: document.querySelector("#specialTypes"),
  summary: document.querySelector("#summary"),
  search: document.querySelector("#search"),
  reset: document.querySelector("#reset"),
  count: document.querySelector("#count"),
  cinemas: document.querySelector("#cinemas"),
  detailEmpty: document.querySelector("#detailEmpty"),
  detailContent: document.querySelector("#detailContent"),
  detailName: document.querySelector("#detailName"),
  detailAddress: document.querySelector("#detailAddress"),
  detailSource: document.querySelector("#detailSource"),
  halls: document.querySelector("#halls"),
};

function chip(label, value, active, onClick) {
  const button = document.createElement("button");
  button.className = `chip${active ? " active" : ""}`;
  button.textContent = label;
  button.type = "button";
  button.addEventListener("click", () => onClick(value));
  return button;
}

function specialClassName(text) {
  const lower = String(text).toLowerCase();
  if (lower.includes("seed")) return "seed";
  if (lower.includes("imax")) return "imax";
  if (text.includes("杜比")) return "dolby";
  if (lower.includes("cinity")) return "cinity";
  if (text.includes("激光") || text.includes("中国巨幕")) return "laser";
  return "";
}

function badge(text) {
  const span = document.createElement("span");
  const typeClass = specialClassName(text);
  span.className = `badge${typeClass ? ` ${typeClass}` : ""}`;
  span.textContent = text;
  return span;
}

function specialMatches(specialTypes, selected) {
  if (!selected) return true;
  const types = (specialTypes || "").split(",").filter(Boolean);
  const group = SPECIAL_GROUPS[selected];
  if (group) return group.some((type) => types.includes(type));
  return types.includes(selected);
}

function setSpecial(value) {
  state.special = state.special === value ? "" : value;
  refresh().catch(handleError);
}

function showEmptyDetail(message = "选择一家影院查看逐厅配置") {
  state.detailRequestId += 1;
  els.detailContent.hidden = true;
  els.detailEmpty.hidden = false;
  els.detailEmpty.textContent = message;
}

function handleError(error) {
  els.meta.textContent = `加载失败：${error.message}`;
}

async function loadFilters() {
  const [districts, specialTypes, summary] = await Promise.all([
    getJson("/api/districts"),
    getJson("/api/special-types"),
    getJson("/api/summary"),
  ]);

  const totalCinemas = districts.reduce((sum, item) => sum + item.cinema_count, 0);
  const totalHalls = specialTypes.reduce((sum, item) => sum + item.hall_count, 0);
  els.totalCinemas.textContent = totalCinemas;
  els.totalHalls.textContent = totalHalls;
  els.totalDistricts.textContent = districts.length;

  const quickButtons = Object.keys(SPECIAL_GROUPS).map((name) => {
    const button = document.createElement("button");
    const active = state.special === name;
    const items = summary[name] || [];
    const cinemaCount = new Set(items.map((item) => item.name)).size;
    const typeClass = specialClassName(name);
    button.type = "button";
    button.className = `quick-filter${active ? " active" : ""}${typeClass ? ` ${typeClass}` : ""}`;
    button.textContent = `${name} ${cinemaCount}`;
    button.addEventListener("click", () => setSpecial(name));
    return button;
  });
  els.quickFilters.replaceChildren(...quickButtons);

  els.districts.replaceChildren(
    chip("全部", "", !state.district, (value) => {
      state.district = value;
      refresh().catch(handleError);
    }),
    ...districts.map((item) => chip(`${item.district} ${item.cinema_count}`, item.district, state.district === item.district, (value) => {
      state.district = value;
      refresh().catch(handleError);
    })),
  );

  els.specialTypes.replaceChildren(
    chip("全部", "", !state.special, (value) => {
      setSpecial(value);
    }),
    ...specialTypes.map((item) => chip(`${item.special_type} ${item.hall_count}`, item.special_type, state.special === item.special_type, (value) => {
      setSpecial(value);
    })),
  );

  const rows = Object.entries(summary).map(([name, items]) => {
    const row = document.createElement("div");
    row.className = "summary-row";
    const cinemas = new Set(items.map((item) => item.name));
    row.innerHTML = `<strong>${name}: ${cinemas.size} 家</strong><span>${items.slice(0, 4).map((item) => item.name).join("、")}${items.length > 4 ? "..." : ""}</span>`;
    return row;
  });
  els.summary.replaceChildren(...rows);
  state.filtersLoaded = true;
}

async function loadCinemas() {
  const requestId = ++state.cinemaRequestId;
  const params = new URLSearchParams();
  if (state.district) params.set("district", state.district);
  if (state.special && !SPECIAL_GROUPS[state.special]) params.set("special", state.special);
  if (state.search) params.set("q", state.search);
  let cinemas = await getJson(`/api/cinemas?${params.toString()}`);
  if (requestId !== state.cinemaRequestId) return;
  if (SPECIAL_GROUPS[state.special]) {
    cinemas = cinemas.filter((item) => specialMatches(item.special_types, state.special));
  }

  els.count.textContent = `${cinemas.length} 家影院`;
  const visibleDistricts = new Set(cinemas.map((item) => item.district)).size;
  els.meta.textContent = cinemas.length
    ? `当前结果覆盖 ${visibleDistricts} 个区县；点击影院查看逐厅幕布、音效和座位信息`
    : "当前筛选没有匹配影院，请调整区县、特殊厅或搜索词";

  const cards = cinemas.map((item) => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = `cinema${state.selectedId === item.id ? " active" : ""}`;
    const types = [...new Set((item.special_types || "").split(",").filter(Boolean))]
      .filter((type) => type !== "标准厅")
      .slice(0, 5);
    card.innerHTML = `
      <h3>${item.name}</h3>
      <div class="meta">${item.district} · ${item.address}</div>
      <div class="meta">${item.hall_count} 个影厅 · 来源 ${item.source}</div>
    `;
    const badges = document.createElement("div");
    badges.className = "badges";
    if (item.seed_halls > 0) badges.appendChild(badge("精编 seed"));
    types.forEach((type) => badges.appendChild(badge(type)));
    card.appendChild(badges);
    card.addEventListener("click", () => {
      state.selectedId = item.id;
      loadDetail(item.id, { scrollIntoView: true }).catch(handleError);
      document.querySelectorAll(".cinema").forEach((node) => node.classList.remove("active"));
      card.classList.add("active");
    });
    return card;
  });

  if (!cinemas.length) {
    const empty = document.createElement("div");
    empty.className = "list-empty";
    empty.textContent = "没有找到匹配的影院";
    els.cinemas.replaceChildren(empty);
    state.selectedId = null;
    showEmptyDetail("调整筛选后选择一家影院查看逐厅配置");
    return;
  }

  els.cinemas.replaceChildren(...cards);
  if (!cinemas.some((item) => item.id === state.selectedId)) {
    state.selectedId = cinemas[0].id;
    loadDetail(cinemas[0].id).catch(handleError);
  }
}

async function loadDetail(id, options = {}) {
  const requestId = ++state.detailRequestId;
  const payload = await getJson(`/api/cinemas/${id}`);
  if (requestId !== state.detailRequestId || state.selectedId !== id) return;
  els.detailEmpty.hidden = true;
  els.detailContent.hidden = false;
  els.detailName.textContent = payload.cinema.name;
  els.detailAddress.textContent = `${payload.cinema.district} · ${payload.cinema.address}`;
  els.detailSource.textContent = payload.cinema.source;
  const halls = payload.halls.map((hall) => {
    const node = document.createElement("article");
    node.className = "hall";
    const size = hall.screen_width_m && hall.screen_height_m ? `${hall.screen_width_m} × ${hall.screen_height_m} m` : "待核验";
    const hallBadgeText = hall.source === "special_seed" ? "精编 seed" : hall.special_type;
    const hallBadgeClass = specialClassName(hallBadgeText);
    node.innerHTML = `
      <div class="hall-title">
        <strong>${hall.hall_name}</strong>
        <span class="badge ${hallBadgeClass}">${hallBadgeText}</span>
      </div>
      <div class="spec-grid">
        <div><span>类型</span><strong>${hall.special_type}</strong></div>
        <div><span>银幕</span><strong>${hall.screen_type}</strong></div>
        <div><span>尺寸</span><strong>${size}</strong></div>
        <div><span>音效</span><strong>${hall.sound || "待核验"}</strong></div>
        <div><span>座位</span><strong>${hall.seats || "待核验"}</strong></div>
        <div><span>能力</span><strong>${hall.features || "待核验"}</strong></div>
      </div>
      <p class="meta">来源：${hall.source_detail}</p>
    `;
    return node;
  });
  els.halls.replaceChildren(...halls);
  if (options.scrollIntoView && window.matchMedia("(max-width: 720px)").matches) {
    els.detailContent.scrollIntoView({ behavior: "smooth", block: "start" });
  }
}

async function refresh() {
  state.selectedId = null;
  await Promise.all([loadFilters(), loadCinemas()]);
}

els.search.addEventListener("input", () => {
  state.search = els.search.value.trim();
  loadCinemas().catch(handleError);
});

els.reset.addEventListener("click", () => {
  state.district = "";
  state.special = "";
  state.search = "";
  els.search.value = "";
  refresh().catch(handleError);
});

refresh().catch(handleError);

</script>
